<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Reshot: select an area, mark it up and copy it</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2550"/>
      <stop offset="0.55" stop-color="#3B2A6B"/>
      <stop offset="1" stop-color="#0B0E16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="0" y="0" width="1280" height="780" rx="22"/></clipPath>
    <mask id="dim">
      <rect width="1280" height="780" fill="#fff"/>
      <rect x="300" y="190" width="720" height="400" fill="#000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#FF3B30"/>
    </marker>
  </defs>

  <g clip-path="url(#screen)">
    <!-- desktop -->
    <rect width="1280" height="780" fill="url(#wall)"/>
    <rect width="1280" height="780" fill="url(#glow)"/>

    <!-- menu bar -->
    <rect width="1280" height="30" fill="#000" fill-opacity="0.28"/>
    <circle cx="26" cy="15" r="6" fill="#fff" fill-opacity="0.85"/>
    <text x="46" y="20" font-size="13" font-weight="600" fill="#fff" fill-opacity="0.9">Finder</text>
    <text x="104" y="20" font-size="13" fill="#fff" fill-opacity="0.7">File   Edit   View   Go   Window</text>
    <g transform="translate(1108 7)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.95">
      <path d="M1 6V1H6"/><path d="M10 1H15V6"/><path d="M15 10V15H10"/><path d="M6 15H1V10"/>
    </g>
    <text x="1140" y="20" font-size="13" fill="#fff" fill-opacity="0.85">Tue 9:41</text>

    <!-- app window behind the overlay -->
    <g filter="url(#shadow)">
      <rect x="150" y="90" width="980" height="620" rx="14" fill="#F5F6FA"/>
    </g>
    <rect x="150" y="90" width="980" height="44" rx="14" fill="#E9EBF1"/>
    <rect x="150" y="120" width="980" height="14" fill="#E9EBF1"/>
    <circle cx="176" cy="112" r="6" fill="#FF5F57"/>
    <circle cx="196" cy="112" r="6" fill="#FEBC2E"/>
    <circle cx="216" cy="112" r="6" fill="#28C840"/>
    <text x="640" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#4A4F5C">Sales overview</text>
    <!-- sidebar -->
    <rect x="150" y="134" width="190" height="576" fill="#EEF0F5"/>
    <g fill="#C9CDD8">
      <rect x="172" y="162" width="110" height="10" rx="5"/>
      <rect x="172" y="194" width="140" height="10" rx="5"/>
      <rect x="172" y="226" width="96" height="10" rx="5"/>
      <rect x="172" y="258" width="124" height="10" rx="5"/>
      <rect x="172" y="290" width="104" height="10" rx="5"/>
    </g>
    <rect x="164" y="186" width="160" height="26" rx="7" fill="#0A84FF" fill-opacity="0.12"/>
    <!-- cards -->
    <g>
      <rect x="370" y="160" width="230" height="120" rx="12" fill="#fff"/>
      <text x="392" y="196" font-size="13" fill="#8A90A0">Revenue</text>
      <text x="392" y="240" font-size="34" font-weight="700" fill="#1C1F2A">$48.2k</text>
      <text x="392" y="264" font-size="12" fill="#28A745">▲ 12% this week</text>

      <rect x="620" y="160" width="230" height="120" rx="12" fill="#fff"/>
      <text x="642" y="196" font-size="13" fill="#8A90A0">Orders</text>
      <text x="642" y="240" font-size="34" font-weight="700" fill="#1C1F2A">1,284</text>
      <text x="642" y="264" font-size="12" fill="#28A745">▲ 4% this week</text>

      <rect x="870" y="160" width="230" height="120" rx="12" fill="#fff"/>
      <text x="892" y="196" font-size="13" fill="#8A90A0">Refunds</text>
      <text x="892" y="240" font-size="34" font-weight="700" fill="#1C1F2A">37</text>
      <text x="892" y="264" font-size="12" fill="#E5484D">▼ 9% this week</text>
    </g>
    <!-- chart card -->
    <rect x="370" y="300" width="730" height="290" rx="12" fill="#fff"/>
    <text x="392" y="336" font-size="14" font-weight="600" fill="#1C1F2A">Weekly revenue</text>
    <g stroke="#EEF0F5" stroke-width="1">
      <path d="M392 380H1078M392 430H1078M392 480H1078M392 530H1078"/>
    </g>
    <g fill="#0A84FF">
      <rect x="420" y="470" width="44" height="90" rx="6" fill-opacity="0.35"/>
      <rect x="510" y="440" width="44" height="120" rx="6" fill-opacity="0.35"/>
      <rect x="600" y="455" width="44" height="105" rx="6" fill-opacity="0.35"/>
      <rect x="690" y="410" width="44" height="150" rx="6" fill-opacity="0.35"/>
      <rect x="780" y="380" width="44" height="180" rx="6"/>
      <rect x="870" y="430" width="44" height="130" rx="6" fill-opacity="0.35"/>
      <rect x="960" y="400" width="44" height="160" rx="6" fill-opacity="0.35"/>
    </g>
    <rect x="370" y="610" width="730" height="80" rx="12" fill="#fff"/>
    <g fill="#DDE0E8">
      <rect x="392" y="636" width="260" height="10" rx="5"/>
      <rect x="392" y="660" width="180" height="10" rx="5"/>
    </g>

    <!-- frozen-screen dim, with the selection cut out -->
    <rect width="1280" height="780" fill="#000" fill-opacity="0.5" mask="url(#dim)"/>

    <!-- annotations inside the selection -->
    <rect x="774" y="368" width="64" height="200" rx="10" fill="none" stroke="#FF3B30" stroke-width="5"/>
    <path d="M664 372C700 368 728 372 760 396" fill="none" stroke="#FF3B30" stroke-width="6" stroke-linecap="round" marker-end="url(#head)"/>
    <rect x="432" y="352" width="222" height="40" rx="8" fill="#FFCC00" fill-opacity="0.45"/>
    <text x="543" y="379" text-anchor="middle" font-size="21" font-weight="700" fill="#FF3B30">Best week so far!</text>

    <!-- selection frame + handles -->
    <rect x="300" y="190" width="720" height="400" fill="none" stroke="#0A84FF" stroke-width="2"/>
    <g fill="#fff" stroke="#0A84FF" stroke-width="2">
      <circle cx="300" cy="190" r="5.5"/><circle cx="660" cy="190" r="5.5"/><circle cx="1020" cy="190" r="5.5"/>
      <circle cx="300" cy="390" r="5.5"/><circle cx="1020" cy="390" r="5.5"/>
      <circle cx="300" cy="590" r="5.5"/><circle cx="660" cy="590" r="5.5"/><circle cx="1020" cy="590" r="5.5"/>
    </g>
    <!-- size label -->
    <rect x="300" y="156" width="104" height="26" rx="6" fill="#141416" fill-opacity="0.88"/>
    <text x="352" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">1440 × 800</text>

    <!-- toolbar -->
    <g filter="url(#soft)">
      <rect x="566" y="604" width="396" height="42" rx="10" fill="#FAFAFC" fill-opacity="0.97"/>
    </g>
    <g fill="none" stroke="#2C2C2E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <!-- pen -->
      <path d="M582 636l3-9 12-12 6 6-12 12z"/>
      <!-- line -->
      <path d="M618 636L638 616"/>
    </g>
    <!-- arrow (active) -->
    <rect x="646" y="609" width="32" height="32" rx="7" fill="#0A84FF"/>
    <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M653 634L671 616M661 616H671V626"/>
    </g>
    <g fill="none" stroke="#2C2C2E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <!-- rectangle -->
      <rect x="688" y="616" width="20" height="18" rx="2"/>
      <!-- marker -->
      <path d="M722 636h18M726 630l10-14 5 4-10 14z"/>
      <!-- text -->
      <path d="M756 617h18M765 617v19"/>
    </g>
    <circle cx="796" cy="625" r="8" fill="#FF3B30" stroke="#000" stroke-opacity="0.2"/>
    <g fill="none" stroke="#2C2C2E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <!-- undo -->
      <path d="M820 620h12a6 6 0 0 1 0 12h-8M824 615l-5 5 5 5"/>
    </g>
    <rect x="850" y="614" width="1" height="22" fill="#2C2C2E" fill-opacity="0.2"/>
    <g fill="none" stroke="#2C2C2E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <!-- copy -->
      <rect x="866" y="618" width="13" height="15" rx="2"/><path d="M871 618v-3h13v15h-5"/>
      <!-- save -->
      <path d="M908 614v14M902 622l6 6 6-6M900 636h16"/>
      <!-- close -->
      <path d="M936 618l12 12M948 618l-12 12"/>
    </g>

    <!-- toast -->
    <g filter="url(#soft)">
      <rect x="532" y="700" width="216" height="40" rx="10" fill="#141416" fill-opacity="0.92"/>
    </g>
    <circle cx="556" cy="720" r="9" fill="#34C759"/>
    <path d="M551.5 720.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="574" y="725" font-size="14" font-weight="500" fill="#fff">Copied to clipboard</text>
  </g>
</svg>
