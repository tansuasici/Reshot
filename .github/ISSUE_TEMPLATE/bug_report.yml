name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Screenshots or a screen recording help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press ⌘⇧9
        2. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 26.1 / Windows 11 24H2 / Ubuntu 24.04 (Wayland)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Reshot version
      placeholder: 0.1.0
  - type: textarea
    id: displays
    attributes:
      label: Display setup
      description: Number of monitors, resolutions and scaling (e.g. "MacBook Retina + 1080p external at 100%").
